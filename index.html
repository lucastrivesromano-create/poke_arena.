<section id="select" class="panel screen active"><div class="section-title">01 / ELIGE A TU POKÉMON</div><div id="roster" class="roster"></div><div class="section-title" style="margin-top:15px">02 / ELIGE TU SKIN</div><div id="skins" class="skinrow"></div><div id="details" class="muted"></div><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:15px;flex-wrap:wrap"><span class="muted">Combate 1 contra 1 · 150 segundos</span><button id="start" class="primary">¡A LUCHAR! ▶</button></div></section>

<script>
(()=>{
const P=[
{id:'pika',name:'Pikachu',emoji:'⚡',role:'VELOCISTA',hp:3000,speed:3.25,damage:430,range:265,rate:430,desc:'Rápido y eléctrico. Dispara rayos veloces.',attack:'RAYO TRUENO',super:'TRUENO TOTAL',skins:[['Clásico','#f5c943','#e99b24'],['Nocturno','#7d75bd','#403a78'],['Solar','#ff9d3c','#e35b31']]},
{id:'char',name:'Charizard',emoji:'🔥',role:'ARTILLERO',hp:3900,speed:2.65,damage:650,range:310,rate:760,desc:'Bolas de fuego explosivas y lluvia de llamas.',attack:'LANZALLAMAS',super:'LLUVIA ÍGNEA',skins:[['Clásico','#e87536','#9f3b2e'],['Dragón Azul','#4a9ed2','#27538c'],['Dragón Oscuro','#55415e','#282235']]},
{id:'blastoise',name:'Blastoise',emoji:'💧',role:'TANQUE',hp:5000,speed:2.25,damage:280,range:250,rate:150,desc:'Muchísima resistencia y ráfagas de agua.',attack:'HIDROBOMBA',super:'HIDROCAÑÓN',skins:[['Clásico','#4d9ed0','#315a9a'],['Marina','#4bbaad','#236d75'],['Dorada','#d3a94c','#8a6230']]},
{id:'venu',name:'Venusaur',emoji:'🌿',role:'CONTROL',hp:3900,speed:2.45,damage:520,range:270,rate:720,desc:'Semillas explosivas y raíces que frenan.',attack:'HOJA AFILADA',super:'RAÍCES SALVAJES',skins:[['Clásico','#69ad58','#397b50'],['Carmesí','#d66d85','#8b3c68'],['Selva','#8c9c43','#435c35']]},
{id:'gengar',name:'Gengar',emoji:'👻',role:'ASESINO',hp:3100,speed:3.05,damage:500,range:230,rate:650,desc:'Sombras rápidas y estallido espectral ralentizador.',attack:'BOLA SOMBRA',super:'PESADILLA',skins:[['Clásico','#8264b5','#49336e'],['Hielo','#71c9d2','#39718e'],['Neón','#d85bb5','#743d9c']]},
{id:'lucario',name:'Lucario',emoji:'🔵',role:'TIRADOR',hp:3500,speed:2.85,damage:560,range:340,rate:690,desc:'Esferas de aura precisas que atraviesan rivales.',attack:'ESFERA AURA',super:'AURA EXPLOSIVA',skins:[['Clásico','#4384c6','#304a86'],['Carmesí','#d45a68','#7e344d'],['Dorada','#d6b85a','#8b6b31']]}
];
const $=id=>document.getElementById(id);let chosen=0,skin=0,game=null,keys={},pointer={x:700,y:270},last=0,raf=0;
function drawRoster(){ $('roster').innerHTML=P.map((p,i)=>'<button class="poke '+(i===chosen?'selected':'')+'" data-p="'+i+'"><span class="role">'+p.role+'</span><span class="emoji">'+p.emoji+'</span><b>'+p.name+'</b><small>'+p.hp+' HP · '+p.speed.toFixed(1)+' VEL.</small></button>').join('');$('roster').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{chosen=+b.dataset.p;skin=0;drawRoster();drawSkins()});drawSkins()}
function drawSkins(){let p=P[chosen];$('skins').innerHTML=p.skins.map((s,i)=>'<button class="skin '+(i===skin?'active':'')+'" data-s="'+i+'">✦ '+s[0]+'</button>').join('');$('skins').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{skin=+b.dataset.s;drawSkins()});$('details').innerHTML='<b style="color:#fff">'+p.attack+'</b> · '+p.desc+'<br><span style="color:#d5a4ff">SÚPER: '+p.super+'</span>'}
drawRoster();$('start').onclick=startGame;$('again').onclick=startGame;$('menu').onclick=()=>{stopGame();$('game').classList.remove('active');$('select').classList.add('active')};
const canvas=$('arena'),ctx=canvas.getContext('2d'),W=960,H=540;
function makeFighter(p,sk,x,y,human){return {p,skin:sk,x,y,hp:p.hp,max:p.hp,face:human?0:Math.PI,super:0,cd:0,inv:0,flash:0,walk:0,human,slow:0,attackAnim:0}}
function startGame(){stopGame();$('select').classList.remove('active');$('game').classList.add('active');$('overlay').classList.remove('show');let p=P[chosen];game={time:150,over:false,player:makeFighter(p,skin,185,270,true),enemy:makeFighter(P[(chosen+2)%P.length],0,775,270,false),shots:[],particles:[],obstacles:[{x:390,y:105,w:180,h:48},{x:390,y:387,w:180,h:48},{x:300,y:245,w:65,h:50},{x:595,y:245,w:65,h:50},{x:100,y:100,w:65,h:65},{x:795,y:375,w:65,h:65}]};$('pname').textContent=p.name.toUpperCase();$('ename').textContent=game.enemy.p.name.toUpperCase();last=performance.now();raf=requestAnimationFrame(loop)}
function stopGame(){cancelAnimationFrame(raf);game=null}
function loop(t){if(!game)return;let dt=Math.min((t-last)/16.67,2);last=t;update(dt);render();raf=requestAnimationFrame(loop)}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function blocked(x,y,r){return game.obstacles.some(o=>x+r>o.x&&x-r<o.x+o.w&&y+r>o.y&&y-r<o.y+o.h)}
function move(f,dx,dy,dt){let len=Math.hypot(dx,dy)||1;dx/=len;dy/=len;let sp=f.p.speed*(f.slow>0?.55:1)*dt,nx=Math.max(30,Math.min(W-30,f.x+dx*sp)),ny=Math.max(30,Math.min(H-30,f.y+dy*sp));if(!blocked(nx,f.y,21))f.x=nx;if(!blocked(f.x,ny,21))f.y=ny;if(dx||dy){f.face=Math.atan2(dy,dx);f.walk+=dt*.18}}
function fire(f,a,kind){let p=f.p,n=p.id==='blastoise'&&kind==='normal'?3:1;for(let i=0;i<n;i++){let ang=a+(i-(n-1)/2)*(n>1?.19:0),speed=kind==='super'?8.5:p.id==='pika'?8.2:p.id==='lucario'?7.8:6.2;game.shots.push({x:f.x+Math.cos(ang)*24,y:f.y+Math.sin(ang)*24,vx:Math.cos(ang)*speed,vy:Math.sin(ang)*speed,owner:f,kind,id:p.id,damage:kind==='super'?p.damage*2.3:p.damage,life:kind==='super'?75:58,r:kind==='super'?13:p.id==='char'?10:7,hit:[]})}}
function attack(f,a){if(f.cd>0||game.over)return;f.cd=f.p.rate/16.67;f.attackAnim=12;fire(f,a,'normal');let s=game.shots.at(-1);if(f.p.id==='venu')s.kind='seed';if(f.p.id==='gengar')s.kind='shadow'}
function particle(x,y,color,r){game.particles.push({x,y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,life:25,color,r})}
function damage(f,n,from){if(f.inv>0||f.hp<=0)return;f.hp=Math.max(0,f.hp-n);f.flash=8;f.inv=5;from.super=Math.min(100,from.super+12);for(let i=0;i<7;i++)particle(f.x,f.y,'#fff1b8',2);if(f.hp<=0)finish(from.human)}
function superMove(f,a){if(f.super<100||game.over)return;f.super=0;let p=f.p,target=f.human?game.enemy:game.player;if(p.id==='pika'){for(let i=0;i<8;i++)fire(f,i*Math.PI/4,'super')}else if(p.id==='venu'||p.id==='gengar'){if(dist(f,target)<180){damage(target,p.id==='venu'?1000:900,f);target.slow=65}for(let i=0;i<18;i++)particle(f.x+(Math.random()-.5)*180,f.y+(Math.random()-.5)*180,p.id==='venu'?'#8be66e':'#c58aff',3)}else if(p.id==='blastoise'){for(let i=-2;i<=2;i++)fire(f,a+i*.16,'super')}else if(p.id==='char'){for(let i=0;i<12;i++){let an=Math.random()*Math.PI*2;game.shots.push({x:f.x+Math.cos(an)*130,y:f.y+Math.sin(an)*130,vx:0,vy:0,owner:f,kind:'burst',id:p.id,damage:230,life:25,r:22,hit:[]})}}else fire(f,a,'super')}
function update(dt){let g=game,p=g.player,e=g.enemy;if(g.over)return;g.time=Math.max(0,g.time-dt/60);for(let f of [p,e]){f.cd=Math.max(0,f.cd-dt);f.inv=Math.max(0,f.inv-dt);f.flash=Math.max(0,f.flash-dt);f.slow=Math.max(0,f.slow-dt);f.attackAnim=Math.max(0,f.attackAnim-dt)}
let dx=(keys.right?1:0)-(keys.left?1:0)+(keys.d?1:0)-(keys.a?1:0),dy=(keys.down?1:0)-(keys.up?1:0)+(keys.s?1:0)-(keys.w?1:0);move(p,dx,dy,dt);p.face=Math.atan2(pointer.y-p.y,pointer.x-p.x);
let d=dist(e,p);if(d>205)move(e,(p.x-e.x)/d,(p.y-e.y)/d,dt*.76);else if(d<125)move(e,(e.x-p.x)/d,(e.y-p.y)/d,dt*.7);else move(e,Math.cos(performance.now()/800)*.5,Math.sin(performance.now()/800)*.5,dt*.4);e.face=Math.atan2(p.y-e.y,p.x-e.x);if(e.cd<=0&&d<e.p.range+20)attack(e,e.face);
for(let i=g.shots.length-1;i>=0;i--){let s=g.shots[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;let target=s.owner.human?e:p;if(dist(s,target)<s.r+20&&!s.hit.includes(target)){damage(target,s.damage,s.owner);s.hit.push(target);if(s.id==='venu')target.slow=65;if(s.id==='gengar')target.slow=45;if(s.kind==='super'&&s.id==='lucario')s.life=0}if(s.life<=0||s.x<0||s.x>W||s.y<0||s.y>H||g.obstacles.some(o=>s.x>o.x&&s.x<o.x+o.w&&s.y>o.y&&s.y<o.y+o.h)){if(s.id==='char')for(let j=0;j<5;j++)particle(s.x,s.y,'#ff9a42',3);g.shots.splice(i,1)}}
for(let i=g.particles.length-1;i>=0;i--){let q=g.particles[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;if(q.life<=0)g.particles.splice(i,1)}
$('php').style.width=(p.hp/p.max*100)+'%';$('ehp').style.width=(e.hp/e.max*100)+'%';$('timer').textContent=Math.floor(g.time/60)+':'+String(Math.floor(g.time%60)).padStart(2,'0');$('super').disabled=p.super<100;$('super').innerHTML='SÚPER<br>'+Math.floor(p.super)+'%';if(g.time<=0)finish(p.hp>=e.hp)}
function finish(win){if(!game||game.over)return;game.over=true;$('result').textContent=win?'¡VICTORIA!':'DERROTA';$('resultText').textContent=win?'Has dominado la arena. ¡Buen combate!':'El rival se ha llevado esta ronda. ¡Prueba otra estrategia!';$('overlay').classList.add('show')}
function rounded(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function render(){let g=game;if(!g)return;ctx.clearRect(0,0,W,H);ctx.fillStyle='#397b53';ctx.fillRect(0,0,W,H);ctx.fillStyle='#43875b';for(let y=0;y<H;y+=48)for(let x=0;x<W;x+=48)if((x/48+y/48)%2===0)ctx.fillRect(x,y,48,48);ctx.strokeStyle='#ffffff12';ctx.lineWidth=2;for(let x=0;x<W;x+=48){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
ctx.fillStyle='#e4c66a';ctx.beginPath();ctx.ellipse(480,270,100,72,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff4b0';ctx.lineWidth=5;ctx.stroke();for(const o of g.obstacles){rounded(o.x+5,o.y+8,o.w,o.h,10,'#244832');rounded(o.x,o.y,o.w,o.h,10,'#a5b66b');rounded(o.x+6,o.y+5,o.w-12,o.h-12,7,'#688d50')}
for(const s of g.shots){ctx.save();ctx.translate(s.x,s.y);ctx.rotate(Math.atan2(s.vy,s.vx));ctx.shadowBlur=15;ctx.shadowColor=s.id==='pika'?'#fff36a':s.id==='char'?'#ff7733':s.id==='blastoise'?'#7de9ff':s.id==='venu'?'#9cff71':s.id==='gengar'?'#c88aff':'#70baff';ctx.fillStyle=s.id==='pika'?'#fff27b':s.id==='char'?'#ff843e':s.id==='blastoise'?'#9beaff':s.id==='venu'?'#9de86b':s.id==='gengar'?'#ba8be9':'#76b9ff';ctx.beginPath();if(s.id==='pika'){ctx.moveTo(-13,-5);ctx.lineTo(0,0);ctx.lineTo(-13,5);ctx.lineTo(-5,0)}else ctx.arc(0,0,s.r,0,7);ctx.fill();ctx.restore()}
for(const f of [g.player,g.enemy])drawFighter(f);for(const q of g.particles){ctx.globalAlpha=Math.max(0,q.life/30);ctx.fillStyle=q.color;ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,7);ctx.fill();ctx.globalAlpha=1}}
function drawFighter(f){let p=f.p,s=p.skins[f.skin],c=s[1],dark=s[2];ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.face);ctx.globalAlpha=f.inv>0&&Math.floor(f.inv)%2===0?.5:1;ctx.fillStyle='#07132155';ctx.beginPath();ctx.ellipse(0,15,25,13,0,0,7);ctx.fill();ctx.translate(0,Math.sin(f.walk)*2);if(f.attackAnim>0){ctx.strokeStyle='#fff7bd';ctx.lineWidth=5;ctx.beginPath();ctx.arc(0,0,34,-.7,.7);ctx.stroke()}ctx.fillStyle=dark;ctx.beginPath();ctx.ellipse(-9,15,8,8,0,0,7);ctx.ellipse(10,15,8,8,0,0,7);ctx.fill();ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(0,0,p.id==='blastoise'?25:22,22,0,0,7);ctx.fill();
if(p.id==='pika'){ctx.beginPath();ctx.moveTo(-14,-13);ctx.lineTo(-22,-38);ctx.lineTo(-5,-22);ctx.fill();ctx.beginPath();ctx.moveTo(14,-13);ctx.lineTo(23,-37);ctx.lineTo(5,-22);ctx.fill();ctx.fillStyle='#33243a';ctx.fillRect(-16,-8,4,7);ctx.fillRect(11,-8,4,7);ctx.fillStyle='#e85d52';ctx.beginPath();ctx.arc(-19,4,5,0,7);ctx.arc(19,4,5,0,7);ctx.fill();ctx.fillStyle='#f2c448';ctx.beginPath();ctx.moveTo(-19,1);ctx.lineTo(-34,-8);ctx.lineTo(-29,4);ctx.lineTo(-39,10);ctx.lineTo(-19,10);ctx.fill()}
else if(p.id==='char'){ctx.beginPath();ctx.moveTo(-15,-12);ctx.lineTo(-25,-34);ctx.lineTo(-4,-20);ctx.fill();ctx.beginPath();ctx.moveTo(14,-12);ctx.lineTo(24,-34);ctx.lineTo(5,-20);ctx.fill();ctx.fillStyle='#ffd36a';ctx.beginPath();ctx.moveTo(23,10);ctx.quadraticCurveTo(43,0,37,-18);ctx.quadraticCurveTo(52,-7,44,17);ctx.fill();ctx.beginPath();ctx.arc(44,-16,7,0,7);ctx.fill()}
else if(p.id==='blastoise'){ctx.strokeStyle='#d5bd83';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-17,-8);ctx.lineTo(-28,-21);ctx.moveTo(17,-8);ctx.lineTo(28,-21);ctx.stroke();ctx.fillStyle='#c9b98e';ctx.beginPath();ctx.arc(0,0,15,0,7);ctx.fill();ctx.fillStyle='#8eeaff';ctx.fillRect(18,-5,15,10)}
else if(p.id==='venu'){ctx.fillStyle='#e56b91';ctx.beginPath();ctx.arc(-8,-20,12,0,7);ctx.arc(8,-20,12,0,7);ctx.fill();ctx.fillStyle='#6cbf57';ctx.beginPath();ctx.ellipse(0,-27,7,15,0,0,7);ctx.fill()}
else if(p.id==='gengar'){ctx.fillStyle=dark;for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(-18+i*9,-14);ctx.lineTo(-15+i*9,-37+(i%2)*6);ctx.lineTo(-7+i*9,-15);ctx.fill()}ctx.fillStyle='#fff';ctx.fillRect(-13,-7,7,5);ctx.fillRect(7,-7,7,5);ctx.fillStyle='#ff6d9a';ctx.fillRect(-4,5,8,3)}

canvas.addEventListener('pointermove',e=>{let r=canvas.getBoundingClientRect();pointer={x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}});canvas.addEventListener('pointerdown',e=>{if(!game||game.over)return;let r=canvas.getBoundingClientRect();pointer={x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};attack(game.player,Math.atan2(pointer.y-game.player.y,pointer.x-game.player.x))});
