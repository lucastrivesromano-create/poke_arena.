<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Poké Arena</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#f8fafc;font-family:system-ui,Arial;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:14px}
main{width:min(100%,760px);text-align:center}h1{margin:4px 0;color:#facc15;font-size:clamp(30px,7vw,48px);letter-spacing:2px}p{color:#cbd5e1;margin:6px}
.panel{background:#1e293b;border:1px solid #334155;border-radius:18px;padding:14px;margin:12px 0}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pick{background:#334155;color:white;border:2px solid transparent;border-radius:12px;padding:12px 4px;font-size:16px}.pick.selected{border-color:#facc15;background:#475569}
button{cursor:pointer;font-weight:700}.arena{position:relative;overflow:hidden;max-width:560px;margin:auto;aspect-ratio:1.35;background:repeating-linear-gradient(0deg,#287044 0 34px,#2c7a49 34px 68px);border:5px solid #64748b;border-radius:14px;touch-action:none}
.fighter{position:absolute;font-size:clamp(34px,9vw,58px);transform:translate(-50%,-50%);filter:drop-shadow(0 4px 2px #123);transition:left .08s,top .08s}
.hp{height:12px;background:#475569;border-radius:20px;overflow:hidden;margin:5px 0}.hp span{display:block;height:100%;background:#22c55e;width:100%}
.hud{display:flex;justify-content:space-between;gap:15px;text-align:left}.hud>div{width:50%}
.controls{display:grid;grid-template-columns:repeat(3,64px);justify-content:center;gap:6px;margin:12px auto}.controls button,.attack{background:#475569;color:white;border:0;border-radius:12px;padding:14px;font-size:19px}.controls .empty{visibility:hidden}.actions{display:flex;justify-content:center;gap:10px}.attack{background:#dc2626;min-width:115px}.special{background:#7c3aed}
#message{font-weight:700;color:#fde68a;min-height:24px}
</style>
</head>
<body><main>
<h1>POKÉ ARENA</h1><p>Combates Pokémon · prototipo jugable</p>
<section class="panel" id="select"><h2>Elige tu Pokémon</h2><div class="choices" id="choices"></div><button class="attack" style="margin-top:12px" onclick="start()">¡A combatir!</button></section>
<section class="panel" id="game" hidden>
<div class="hud"><div><b id="youName">TÚ</b><div class="hp"><span id="youHP"></span></div></div><div><b>RIVAL CPU</b><div class="hp"><span id="cpuHP"></span></div></div></div>
<div class="arena" id="arena"><div class="fighter" id="you">⚡</div><div class="fighter" id="cpu">🔥</div></div>
<div id="message">¡Que empiece el combate!</div>
<div class="controls"><span class="empty"></span><button onpointerdown="move(0,-1)">▲</button><span class="empty"></span><button onpointerdown="move(-1,0)">◀</button><button onpointerdown="move(0,1)">▼</button><button onpointerdown="move(1,0)">▶</button></div>
<div class="actions"><button class="attack" onclick="hit(false)">ATAQUE</button><button class="attack special" onclick="hit(true)">ESPECIAL</button></div>
<button class="pick" style="margin-top:12px" onclick="location.reload()">Volver a elegir</button>
</section>
<p style="font-size:12px">Esta versión incluye combate contra CPU. El multijugador online 1v1 será el siguiente paso.</p>
</main>
<script>
const mons=[{n:"Pikachu",e:"⚡",a:"Eléctrico"},{n:"Charmander",e:"🔥",a:"Fuego"},{n:"Squirtle",e:"💧",a:"Agua"},{n:"Bulbasaur",e:"🌿",a:"Planta"},{n:"Gengar",e:"👻",a:"Fantasma"},{n:"Machop",e:"🥊",a:"Lucha"}];
let chosen=0,y=100,c=100,x=22,yy=50,cx=78,cy=50,lock=false;
const choices=document.getElementById('choices');
mons.forEach((m,i)=>{let b=document.createElement('button');b.className='pick'+(i===0?' selected':'');b.innerHTML=m.e+'<br>'+m.n;b.onclick=()=>{chosen=i;document.querySelectorAll('.pick').forEach(z=>z.classList.remove('selected'));b.classList.add('selected')};choices.appendChild(b)});
function start(){document.getElementById('select').hidden=true;document.getElementById('game').hidden=false;document.getElementById('youName').textContent=mons[chosen].n;document.getElementById('you').textContent=mons[chosen].e;document.getElementById('cpu').textContent=mons[(chosen+1)%mons.length].e;draw();say('¡Combate iniciado! Muévete y ataca.')}
function draw(){document.getElementById('you').style.left=x+'%';document.getElementById('you').style.top=yy+'%';document.getElementById('cpu').style.left=cx+'%';document.getElementById('cpu').style.top=cy+'%';document.getElementById('youHP').style.width=y+'%';document.getElementById('cpuHP').style.width=c+'%'}
function say(t){document.getElementById('message').textContent=t}
function move(dx,dy){if(lock||y<=0||c<=0)return;x=Math.max(6,Math.min(94,x+dx*5));yy=Math.max(8,Math.min(92,yy+dy*6));draw();cpuTurn()}
function hit(sp){if(lock||y<=0||c<=0)return;let d=Math.hypot(x-cx,yy-cy);if(d>(sp?32:19)){say('¡Estás demasiado lejos! Acércate al rival.');cpuTurn();return}c=Math.max(0,c-(sp?24:13));say(sp?'¡Ataque especial!':'¡Buen golpe!');draw();if(c===0){say('¡VICTORIA! Has ganado el combate.');return}cpuTurn()}
function cpuTurn(){if(lock||y<=0||c<=0)return;lock=true;setTimeout(()=>{let d=Math.hypot(x-cx,yy-cy);if(d<25){y=Math.max(0,y-9);say('El rival te ha golpeado.')}else{cx+=Math.sign(x-cx)*Math.min(4,Math.abs(x-cx));cy+=Math.sign(yy-cy)*Math.min(4,Math.abs(yy-cy));say('El rival se acerca...')}draw();if(y===0)say('DERROTA. ¡Inténtalo otra vez!');lock=false},450)}
</script></body></html>
