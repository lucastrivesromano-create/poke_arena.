<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10152d"><title>Poké Arena</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#28345c,#0b1022 70%);color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;display:grid;place-items:center;padding:16px}.shell{width:min(100%,920px)}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.logo{font-weight:1000;font-size:clamp(24px,5vw,38px);letter-spacing:2px;text-shadow:0 3px 0 #8b4c17,0 6px 18px #000}.logo span{color:#ffd43b}.tag{font-size:11px;color:#b8c5ec;letter-spacing:2px}.panel{background:linear-gradient(145deg,#202b4b,#131c36);border:1px solid #465781;border-radius:20px;padding:16px;box-shadow:0 18px 45px #0008}.hidden{display:none!important}.heading{text-align:center;font-weight:900;font-size:22px;margin:0 0 5px}.sub{text-align:center;color:#b9c5e4;font-size:13px;margin:0 0 14px}.roster{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.mon{border:2px solid #455477;background:linear-gradient(145deg,#344466,#202c49);color:white;border-radius:15px;padding:10px;min-height:112px;cursor:pointer;transition:.15s}.mon.active{border-color:#ffe16b;box-shadow:0 0 0 3px #ffe16b33,0 7px 18px #0005;transform:translateY(-2px)}.mon .art{font-size:39px;display:block;filter:drop-shadow(0 4px 2px #0007)}.mon b{display:block;font-size:14px}.type{font-size:10px;color:#d7e0fa}.primary{display:block;margin:16px auto 0;border:0;border-radius:999px;padding:13px 30px;font-weight:1000;font-size:15px;letter-spacing:1px;color:#382509;background:linear-gradient(#ffe77a,#ffad28);box-shadow:0 5px 0 #b96816;cursor:pointer}.primary:active{transform:translateY(3px);box-shadow:0 2px 0 #b96816}.gamebox{padding:10px}.hud{display:flex;justify-content:space-between;gap:12px;padding:4px 6px 10px}.player{width:46%;font-size:12px;font-weight:800}.player.right{text-align:right}.bar{height:11px;border-radius:20px;background:#10182e;border:1px solid #66759a;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#45e18a,#a5f36a);transition:width .2s}.right .bar i{margin-left:auto;background:linear-gradient(90deg,#ffb44b,#ff5c6d)}canvas{width:100%;display:block;aspect-ratio: 1.55;border-radius:14px;border:3px solid #7483a8;background:#315d42;touch-action:none}.under{display:flex;align-items:center;justify-content:space-between;padding:8px 5px 0;color:#cbd6f3;font-size:12px}.controls{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 4px 2px}.pad{width:132px;height:116px;position:relative;flex:none}.pad button,.action{border:1px solid #7181a8;color:white;background:linear-gradient(#53668d,#29395f);box-shadow:0 4px 0 #172343;border-radius:13px;font-weight:900;touch-action:none}.pad button{position:absolute;width:42px;height:38px;font-size:18px}.up{top:0;left:45px}.down{bottom:0;left:45px}.left{left:0;top:39px}.rightkey{right:0;top:39px}.actions{display:flex;gap:9px}.action{width:76px;height:76px;border-radius:50%;font-size:11px;background:linear-gradient(#ff9c55,#e84b39);border:3px solid #ffc18a;box-shadow:0 5px 0 #8e2d2d}.action.special{background:linear-gradient(#bd8cff,#7045cf);border-color:#d8c3ff;box-shadow:0 5px 0 #402878}.action small{display:block;font-size:24px}.action:active,.pad button:active{filter:brightness(1.3);transform:translateY(2px)}.status{text-align:center;color:#ffe17b;font-weight:900;min-height:22px;font-size:13px}.back{border:0;background:none;color:#b8c5e6;text-decoration:underline;cursor:pointer;font-size:12px}@media(max-width:520px){body{padding:8px}.panel{padding:11px}.roster{gap:7px}.mon{min-height:95px;padding:7px}.mon .art{font-size:32px}.controls{gap:4px}.pad{transform:scale(.88);transform-origin:left center;margin-right:-12px}.action{width:65px;height:65px}.tag{display:none}}
</style></head><body><main class="shell"><header><div><div class="logo">POKÉ <span>ARENA</span></div><div class="tag">ELIGE · LUCHA · CONQUISTA</div></div><div class="tag">1 VS 1 · ARENA</div></header>
<section class="panel" id="menu"><h2 class="heading">ELIGE A TU LUCHADOR</h2><p class="sub">Cada criatura tiene su propio estilo de combate</p><div class="roster" id="roster"></div><button class="primary" id="play">¡ENTRAR EN LA ARENA!</button></section>
<section class="panel gamebox hidden" id="game"><div class="hud"><div class="player"><span id="pname">TÚ</span><div class="bar"><i id="php"></i></div></div><div class="player right"><span id="ename">RIVAL</span><div class="bar"><i id="ehp"></i></div></div></div><canvas id="arena" width="900" height="580"></canvas><div class="under"><span>⚡ CARGA ESPECIAL <b id="charge">0%</b></span><button class="back" id="back">Cambiar Pokémon</button></div><div class="status" id="status">¡Prepárate para luchar!</div><div class="controls"><div class="pad"><button class="up" data-x="0" data-y="-1">▲</button><button class="down" data-x="0" data-y="1">▼</button><button class="left" data-x="-1" data-y="0">◀</button><button class="rightkey" data-x="1" data-y="0">▶</button></div><div class="actions"><button class="action" id="attack"><small>✦</small>ATAQUE</button><button class="action special" id="special"><small>✹</small>ESPECIAL</button></div></div></section><p class="sub" style="margin-top:12px">PROTOTIPO · Combate contra CPU · Multijugador online en desarrollo</p></main>
<script>
const mons=[{name:'Pikachu',emoji:'⚡',type:'ELÉCTRICO',color:'#ffd83d',dark:'#c88a19',power:1},{name:'Charmander',emoji:'🔥',type:'FUEGO',color:'#ff914d',dark:'#bf482f',power:1},{name:'Squirtle',emoji:'💧',type:'AGUA',color:'#64c9ef',dark:'#287da9',power:1},{name:'Bulbasaur',emoji:'🌿',type:'PLANTA',color:'#83d477',dark:'#38854b',power:1},{name:'Gengar',emoji:'👻',type:'FANTASMA',color:'#b18bdf',dark:'#67449a',power:1},{name:'Machop',emoji:'🥊',type:'LUCHA',color:'#a9b8d5',dark:'#596b8b',power:1}];
let selected=0,started=false,keys={},shots=[],sparks=[],last=0,enemyThink=0;
const $=id=>document.getElementById(id),canvas=$('arena'),ctx=canvas.getContext('2d');
const roster=$('roster');mons.forEach((m,i)=>{let b=document.createElement('button');b.className='mon'+(!i?' active':'');b.innerHTML='<span class="art">'+m.emoji+'</span><b>'+m.name+'</b><span class="type">'+m.type+'</span>';b.onclick=()=>{selected=i;document.querySelectorAll('.mon').forEach(x=>x.classList.remove('active'));b.classList.add('active')};roster.appendChild(b)});
let p,e,charge=0,ended=false,hitFlash=0;
function fighter(x,y,mon){return{x,y,r:30,hp:100,mon,cd:0,inv:0,face:1}}
function start(){p=fighter(245,290,mons[selected]);e=fighter(655,290,mons[(selected+1)%mons.length]);charge=0;shots=[];sparks=[];ended=false;started=true;$('menu').classList.add('hidden');$('game').classList.remove('hidden');$('pname').textContent=mons[selected].name;$('ename').textContent=e.mon.name;$('status').textContent='¡Combate iniciado!';last=performance.now();requestAnimationFrame(loop)}
$('play').onclick=start;$('back').onclick=()=>{started=false;$('game').classList.add('hidden');$('menu').classList.remove('hidden')};
document.querySelectorAll('.pad button').forEach(b=>{let x=+b.dataset.x,y=+b.dataset.y;b.addEventListener('pointerdown',ev=>{ev.preventDefault();keys[''+x+y]=true});['pointerup','pointerleave','pointercancel'].forEach(n=>b.addEventListener(n,()=>keys[''+x+y]=false))});
window.addEventListener('keydown',ev=>{let k=ev.key.toLowerCase();keys[k]=true;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))ev.preventDefault()});window.addEventListener('keyup',ev=>keys[ev.key.toLowerCase()]=false);
function moveVec(){let dx=(keys['ArrowRight']||keys.d?1:0)-(keys['ArrowLeft']||keys.a?1:0),dy=(keys['ArrowDown']||keys.s?1:0)-(keys['ArrowUp']||keys.w?1:0);dx+=(keys['10']?1:0)-(keys['-10']?1:0);dy+=(keys['01']?1:0)-(keys['0-1']?1:0);let l=Math.hypot(dx,dy)||1;return[dx/l,dy/l]}
function fire(who,target,special=false){if(ended||who.cd>0)return;if(who===p&&special&&charge<100){$('status').textContent='¡Necesitas cargar la barra especial!';return}if(special&&who===p)charge=0;who.cd=special?1.0:.42;let dx=target.x-who.x,dy=target.y-who.y,d=Math.hypot(dx,dy)||1;shots.push({x:who.x,y:who.y,dx:dx/d,dy:dy/d,owner:who,damage:special?27:13,speed:special?520:430,r:special?13:8,color:who.mon.color,life:1.4});for(let i=0;i<8;i++)sparks.push({x:who.x,y:who.y,dx:(Math.random()-.5)*140,dy:(Math.random()-.5)*140,life:.35,color:who.mon.color})}
$('attack').onpointerdown=ev=>{ev.preventDefault();fire(p,e,false)};$('special').onpointerdown=ev=>{ev.preventDefault();fire(p,e,true)};
function obstacle(x,y,r){return Math.hypot(x-450,y-290)<r+25||Math.hypot(x-450,y-290)<r+25}
function update(dt){if(ended)return;p.cd=Math.max(0,p.cd-dt);e.cd=Math.max(0,e.cd-dt);p.inv=Math.max(0,p.inv-dt);e.inv=Math.max(0,e.inv-dt);let [dx,dy]=moveVec(),speed=250;p.x=Math.max(40,Math.min(860,p.x+dx*speed*dt));p.y=Math.max(45,Math.min(535,p.y+dy*speed*dt));if(dx)p.face=Math.sign(dx);
let vx=p.x-e.x,vy=p.y-e.y,d=Math.hypot(vx,vy)||1;if(d>170){e.x+=vx/d*110*dt;e.y+=vy/d*110*dt}else if(d<115){e.x-=vx/d*80*dt;e.y-=vy/d*80*dt}e.x=Math.max(40,Math.min(860,e.x));e.y=Math.max(45,Math.min(535,e.y));if(e.cd<=0&&d<500&&Math.random()<dt*1.4)fire(e,p,false);
shots.forEach(s=>{s.x+=s.dx*s.speed*dt;s.y+=s.dy*s.speed*dt;s.life-=dt;let t=s.owner===p?e:p;if(Math.hypot(s.x-t.x,s.y-t.y)<t.r+s.r){t.hp=Math.max(0,t.hp-s.damage);t.inv=.16;s.life=0;if(s.owner===p)charge=Math.min(100,charge+s.damage*1.5);for(let i=0;i<12;i++)sparks.push({x:s.x,y:s.y,dx:(Math.random()-.5)*220,dy:(Math.random()-.5)*220,life:.45,color:s.color})}});shots=shots.filter(s=>s.life>0&&s.x>0&&s.x<900&&s.y>0&&s.y<580);sparks.forEach(a=>{a.x+=a.dx*dt;a.y+=a.dy*dt;a.life-=dt});sparks=sparks.filter(a=>a.life>0);$('php').style.width=p.hp+'%';$('ehp').style.width=e.hp+'%';$('charge').textContent=Math.floor(charge)+'%';if(e.hp<=0||p.hp<=0){ended=true;$('status').textContent=e.hp<=0?'🏆 ¡VICTORIA! Has ganado la arena.':'💥 DERROTA. ¡Vuelve a intentarlo!'}}
function draw(){ctx.clearRect(0,0,900,580);let g=ctx.createLinearGradient(0,0,900,580);g.addColorStop(0,'#397b52');g.addColorStop(1,'#1d593f');ctx.fillStyle=g;ctx.fillRect(0,0,900,580);
ctx.strokeStyle='#ffffff12';ctx.lineWidth=2;for(let x=0;x<900;x+=48){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,580);ctx.stroke()}for(let y=0;y<580;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(900,y);ctx.stroke()}
ctx.fillStyle='#174b38';ctx.fillRect(0,0,900,16);ctx.fillRect(0,564,900,16);for(let i=0;i<18;i++){let x=(i*173+47)%900,y=(i*97+30)%580;ctx.fillStyle=i%2?'#4e9b61':'#2d704a';ctx.beginPath();ctx.arc(x,y,10+(i%3)*3,0,Math.PI*2);ctx.fill()}
ctx.fillStyle='#8e9b83';ctx.strokeStyle='#d4dfb6';ctx.lineWidth=5;ctx.beginPath();ctx.roundRect(414,250,72,80,14);ctx.fill();ctx.stroke();ctx.fillStyle='#697d68';ctx.beginPath();ctx.ellipse(450,290,20,13,0,0,Math.PI*2);ctx.fill();
drawMon(p,true);drawMon(e,false);shots.forEach(s=>{ctx.shadowBlur=22;ctx.shadowColor=s.color;ctx.fillStyle=s.color;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0});sparks.forEach(a=>{ctx.globalAlpha=Math.max(0,a.life*2);ctx.fillStyle=a.color;ctx.beginPath();ctx.arc(a.x,a.y,4,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1})}
function drawMon(f,isPlayer){let {x,y,mon}=f;ctx.save();ctx.translate(x,y);ctx.fillStyle='#07152b66';ctx.beginPath();ctx.ellipse(0,23,34,13,0,0,Math.PI*2);ctx.fill();if(f.inv>0)ctx.globalAlpha=.5;
ctx.fillStyle=mon.dark;ctx.beginPath();ctx.ellipse(-18,-20,10,19,-.5,0,Math.PI*2);ctx.ellipse(18,-20,10,19,.5,0,Math.PI*2);ctx.fill();ctx.fillStyle=mon.color;ctx.beginPath();ctx.ellipse(0,0,29,31,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff8';ctx.lineWidth=3;ctx.stroke();
ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(-10,-5,7,9,0,0,Math.PI*2);ctx.ellipse(10,-5,7,9,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#17213a';ctx.beginPath();ctx.arc(-9,-4,3.5,0,Math.PI*2);ctx.arc(11,-4,3.5,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#542d35';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,7,7,.15,Math.PI-.15);ctx.stroke();ctx.fillStyle=mon.dark;ctx.beginPath();ctx.arc(-21,8,5,0,Math.PI*2);ctx.arc(21,8,5,0,Math.PI*2);ctx.fill();
ctx.font='bold 17px system-ui';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.shadowColor='#000';ctx.shadowBlur=5;ctx.fillText(mon.emoji,0,-43);ctx.restore()}
function loop(now){if(!started)return;let dt=Math.min(.035,(now-last)/1000);last=now;update(dt);draw();if(!ended)requestAnimationFrame(loop);else draw()}
</script></body></html>
